name: Manual backfill

# Daily ingestion runs inside the Databricks job (resources/gharchive_daily.job.yml). This
# workflow is for ad-hoc backfills of GH Archive history from GitHub's runners: open it in the
# Actions tab, click "Run workflow" and enter a range. Hours already landed are skipped.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start hour, UTC (e.g. 2026-09-01T00). Blank = last 48 hours."
        required: false
      end:
        description: "Backfill end hour, UTC, exclusive (e.g. 2026-09-02T00). Blank = now."
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill GH Archive into the prod landing volume
        run: python -m ingestion.gharchive
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LANDING_VOLUME_PATH: /Volumes/workspace/gharchive/landing
          INGEST_START: ${{ inputs.start }}
          INGEST_END: ${{ inputs.end }}
