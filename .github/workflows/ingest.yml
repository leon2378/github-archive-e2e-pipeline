name: Daily ingestion

on:
  schedule:
    # Two runs ahead of the 03:00 UTC Databricks job, at unusual minutes: GitHub delays or drops
    # scheduled runs at busy times such as :00 and :30, so the second run is a safety net. Both
    # are safe to repeat: GH Archive hours already landed are skipped (48-hour look-back), and
    # repo enrichment runs at most once per UTC day.
    - cron: "17 1 * * *"
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start hour, UTC (e.g. 2026-09-01T00). Blank = last 48 hours."
        required: false
      end:
        description: "Backfill end hour, UTC, exclusive (e.g. 2026-09-02T00). Blank = now."
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

# The built-in GITHUB_TOKEN is only used to read public repo metadata.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ingest into the prod landing volume
        run: python -m ingestion.gharchive
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LANDING_VOLUME_PATH: /Volumes/workspace/gharchive/landing
          INGEST_START: ${{ inputs.start }}
          INGEST_END: ${{ inputs.end }}
      - name: Enrich repo metadata from the GitHub API
        # Independent of the step above, so it still runs if the GH Archive download failed.
        if: ${{ !cancelled() }}
        run: python -m ingestion.github_repos
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          LANDING_VOLUME_PATH: /Volumes/workspace/gharchive/landing
          ENRICHMENT_QUEUE_TABLE: workspace.gharchive_gold.ops_repo_enrichment_queue
