# AI/BI dashboard over the gold tables. The dataset queries use unqualified table names;
# dataset_catalog/dataset_schema point them at this target's gold schema (dev or prod).
resources:
  dashboards:
    gharchive_insights:
      display_name: "[${bundle.target}] GitHub Activity Insights"
      file_path: ../src/dashboards/gharchive_insights.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}_gold
