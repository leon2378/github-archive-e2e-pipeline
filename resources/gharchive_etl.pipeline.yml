# Lakeflow Spark Declarative Pipeline, two flows from the landing volume:
#   events/ -> bronze_events -> silver_events
#   repos/  -> bronze_repos  -> silver_repo_fetches + silver_repo_history (SCD Type 2)
resources:
  pipelines:
    gharchive_etl:
      name: "[${bundle.target}] gharchive_etl"
      catalog: ${var.catalog}
      schema: ${resources.schemas.gharchive.name}
      serverless: true
      root_path: ../src/gharchive_etl

      libraries:
        - glob:
            include: ../src/gharchive_etl/transformations/**

      configuration:
        gharchive.landing_path: ${resources.volumes.landing.volume_path}/events
        gharchive.repos_landing_path: ${resources.volumes.landing.volume_path}/repos
