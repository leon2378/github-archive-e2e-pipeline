version: 2

models:
  - name: ops_repo_enrichment_queue
    description: >
      Prioritised list of repos for the next GitHub API enrichment run. Read by
      ingestion/github_repos.py, which fetches from the top until the queue or its API quota
      runs out.
    columns:
      - name: priority
        description: 1 = fetch first.
        data_tests: [unique, not_null]
      - name: repo_id
        data_tests: [unique, not_null]
      - name: repo_name
        description: Current name for known repos (avoids rename redirects), else latest seen.
        data_tests: [not_null]
      - name: reason
        data_tests:
          - accepted_values:
              arguments:
                values: [trending, most_active, refresh]
      - name: etag
        description: ETag from the last 200/304 response, sent as If-None-Match (null if unknown).

unit_tests:
  - name: queue_prioritises_dedupes_skips_unavailable_and_refreshes_stale_repos
    description: >
      Trending first, then the most active (by humans, latest day only, bots skipped, capped),
      then stale known repos. A repo in several groups appears once, in its best group. Repos
      found missing recently are skipped. Known repos use their current name and saved ETag.
    model: ops_repo_enrichment_queue
    overrides:
      vars:
        enrichment_active_top_n: 2
        enrichment_refresh_top_n: 10
        enrichment_refresh_after_days: 7
        enrichment_recheck_unavailable_days: 30
    given:
      - input: ref('fct_repo_daily_activity')
        rows:
          - { event_date: "2026-09-25", repo_id: 10, repo_name: "a/trend", unique_human_actors: 50, total_events: 100 }
          - { event_date: "2026-09-25", repo_id: 20, repo_name: "b/busy", unique_human_actors: 40, total_events: 500 }
          - { event_date: "2026-09-25", repo_id: 30, repo_name: "c/quiet", unique_human_actors: 5, total_events: 9 }
          - { event_date: "2026-09-25", repo_id: 40, repo_name: "d/bots", unique_human_actors: 0, total_events: 999 }
          - { event_date: "2026-09-20", repo_id: 50, repo_name: "e/old", unique_human_actors: 999, total_events: 999 }
      - input: ref('rpt_trending_repos')
        rows:
          - { trending_rank: 1, repo_id: 10, repo_name: "a/trend" }
          - { trending_rank: 2, repo_id: 60, repo_name: "f/gone" }
      - input: ref('dim_repo')
        rows:
          - { repo_id: 10, full_name: "a/trend-renamed" }
          - { repo_id: 20, full_name: "b/busy" }
          - { repo_id: 70, full_name: "g/stale" }
          - { repo_id: 80, full_name: "h/fresh" }
      - input: ref('int_repo_latest_fetch')
        rows:
          - { repo_id: 10, last_checked_at: "2026-09-24 00:00:00", latest_outcome: "ok", is_available: true, last_etag: '"e10"' }
          - { repo_id: 20, last_checked_at: "2026-09-24 00:00:00", latest_outcome: "ok", is_available: true, last_etag: '"e20"' }
          - { repo_id: 60, last_checked_at: "2026-09-20 00:00:00", latest_outcome: "not_found", is_available: false, last_etag: null }
          - { repo_id: 70, last_checked_at: "2026-09-01 00:00:00", latest_outcome: "not_modified", is_available: true, last_etag: '"e70"' }
          - { repo_id: 80, last_checked_at: "2026-09-24 00:00:00", latest_outcome: "ok", is_available: true, last_etag: '"e80"' }
    expect:
      rows:
        - { priority: 1, repo_id: 10, repo_name: "a/trend-renamed", reason: "trending", etag: '"e10"' }
        - { priority: 2, repo_id: 20, repo_name: "b/busy", reason: "most_active", etag: '"e20"' }
        - { priority: 3, repo_id: 70, repo_name: "g/stale", reason: "refresh", etag: '"e70"' }
