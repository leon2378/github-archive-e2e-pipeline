version: 2

models:
  - name: stg_gharchive__events
    description: One row per GitHub event. Thin view over silver_events.
    columns:
      - name: event_id
        data_tests:
          - not_null
          # GH Archive occasionally repeats an event across adjacent hours. Warn, don't fail,
          # and only scan recently loaded rows to keep the test cheap.
          - unique:
              config:
                severity: warn
                where: "_ingested_at >= current_timestamp() - interval 2 days"
      - name: event_type
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null
      - name: event_hour
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: repo_id
        data_tests:
          - not_null

  - name: stg_gharchive__repo_fetches
    description: One row per GitHub API fetch attempt. Thin view over silver_repo_fetches.
    columns:
      - name: repo_id
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
      - name: fetch_outcome
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, not_modified, not_found, blocked, other]

  - name: stg_gharchive__repo_history
    description: >
      Repo attribute versions (SCD Type 2) over silver_repo_history, with valid_from/valid_to
      and an is_current flag. Integrity of the version chain is checked by
      assert_repo_history_is_contiguous.
    columns:
      - name: repo_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
